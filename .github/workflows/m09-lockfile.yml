name: M09 Generate Lockfile

on:
  push:
    branches:
      - m09-auth
    paths:
      - ".github/workflows/m09-lockfile.yml"

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate package-lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit package-lock
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "package-lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(m09): lock Supabase auth dependencies"
          git push origin HEAD:m09-auth
