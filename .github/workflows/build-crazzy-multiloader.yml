name: Build CRAZZY Multiloader V0.3

on:
  push:
    branches:
      - multiloader-build-temp
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Restore V0.3 source ZIP
        shell: pwsh
        run: |
          $parts = 0..3 | ForEach-Object { Get-Content ("tools/multiloader-build/v03.part{0:D2}" -f $_) -Raw }
          $b64 = ($parts -join "")
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\multiloader-v03.zip", [Convert]::FromBase64String($b64))
          Expand-Archive -Path "$env:GITHUB_WORKSPACE\multiloader-v03.zip" -DestinationPath "$env:GITHUB_WORKSPACE\multiloader-v03" -Force

      - name: Apply Windows build compatibility fixes
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\multiloader-v03\CRAZZY_MULTILOADER_V0_2"

          $cmake = Join-Path $root "CMakeLists.txt"
          $text = Get-Content $cmake -Raw
          $needle = "target_compile_options(CrazzyDemoLoader PRIVATE /W4 /permissive- /EHsc /utf-8)"
          if ($text.Contains($needle) -and -not $text.Contains('/MANIFEST:NO')) {
            $replacement = @"
          target_compile_options(CrazzyDemoLoader PRIVATE /W4 /permissive- /EHsc /utf-8)
          set_target_properties(CrazzyMultiloader CrazzyUpdater CrazzyDemoLoader PROPERTIES LINK_FLAGS "/MANIFEST:NO")
          "@
            $text = $text.Replace($needle, $replacement.Trim())
            Set-Content $cmake $text -Encoding UTF8
          }

          $files = @(
            (Join-Path $root "src\ui\MainWindow.cpp"),
            (Join-Path $root "demo\DemoLoader.cpp")
          )
          foreach ($file in $files) {
            $t = Get-Content $file -Raw
            if (-not $t.Contains("#include <windowsx.h>")) {
              $t = $t.Replace("#include <windows.h>", "#include <windows.h>`r`n#include <windowsx.h>")
              if (-not $t.Contains("#include <windowsx.h>")) {
                $t = "#include <windowsx.h>`r`n" + $t
              }
              Set-Content $file $t -Encoding UTF8
            }
          }

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S "$env:GITHUB_WORKSPACE\multiloader-v03\CRAZZY_MULTILOADER_V0_2" -B "$env:GITHUB_WORKSPACE\multiloader-build" -A x64

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build "$env:GITHUB_WORKSPACE\multiloader-build" --config Release --parallel

      - name: Inspect binaries
        shell: pwsh
        run: |
          Get-ChildItem "$env:GITHUB_WORKSPACE\multiloader-build\Release" -Filter *.exe | Select-Object Name,Length
          Get-FileHash "$env:GITHUB_WORKSPACE\multiloader-build\Release\CrazzyMultiloader.exe" -Algorithm SHA256

      - name: Package binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\dist" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\multiloader-build\Release\CrazzyMultiloader.exe" "$env:GITHUB_WORKSPACE\dist\"
          Copy-Item "$env:GITHUB_WORKSPACE\multiloader-build\Release\CrazzyUpdater.exe" "$env:GITHUB_WORKSPACE\dist\"
          Copy-Item "$env:GITHUB_WORKSPACE\multiloader-build\Release\CrazzyDemoLoader.exe" "$env:GITHUB_WORKSPACE\dist\"
          if (Test-Path "$env:GITHUB_WORKSPACE\multiloader-build\Release\mock_releases") {
            Copy-Item "$env:GITHUB_WORKSPACE\multiloader-build\Release\mock_releases" "$env:GITHUB_WORKSPACE\dist\mock_releases" -Recurse
          }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: CRAZZY-MULTILOADER-V0.3-WINDOWS
          path: dist
          if-no-files-found: error
