name: CRAZZY CALL lockfile

on:
  push:
    branches:
      - mcall-crazzy-call
    paths:
      - package.json
      - .github/workflows/call-lockfile.yml

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: mcall-crazzy-call
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate package lock
        run: npm install --package-lock-only --ignore-scripts
      - name: Commit lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "package-lock already current"
          else
            git commit -m "chore(call): update LiveKit lockfile"
            git push origin HEAD:mcall-crazzy-call
          fi
