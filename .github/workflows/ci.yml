name: CRAZZY PROJECT Full Module CI

on:
  push:
    branches:
      - main
      - "m*-*"
      - "production-*"
      - "ux-*"
  pull_request:
    branches:
      - main

concurrency:
  group: crazzy-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Production build
        run: npm run build

      - name: Full module regression suite
        run: node scripts/test-all-modules.mjs

      - name: Unified Discord Bot Core syntax
        run: npm --prefix apps/discord-bot run check
