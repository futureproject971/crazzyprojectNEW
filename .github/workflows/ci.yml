name: CRAZZY PROJECT Front CI

on:
  push:
    branches:
      - phase-1-home
      - m00-design-system
      - "m*-*"
  pull_request:
    branches:
      - main

concurrency:
  group: crazzy-front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test M06 LZT preview
        if: github.ref_name == 'm06-accounts-market'
        run: node scripts/test-lzt-preview.mjs

      - name: Test M08 checkout security
        if: github.ref_name == 'm08-checkout'
        run: node scripts/test-m08-checkout.mjs

      - name: Test M09 auth security
        if: github.ref_name == 'm09-auth'
        run: node scripts/test-m09-auth.mjs

      - name: Test M10 client hub security
        if: github.ref_name == 'm10-client-hub'
        run: node scripts/test-m10-client-hub.mjs

      - name: Test M11 Library security
        if: github.ref_name == 'm11-library'
        run: node scripts/test-m11-library.mjs

      - name: Test M12 profile security
        if: github.ref_name == 'm12-profile'
        run: node scripts/test-m12-profile.mjs

      - name: Test M13 Support security
        if: github.ref_name == 'm13-support'
        run: node scripts/test-m13-support.mjs

      - name: Test M14 Community security
        if: github.ref_name == 'm14-community'
        run: node scripts/test-m14-community.mjs

      - name: Test M17 Rewards security
        if: github.ref_name == 'm17-rewards-clean'
        run: node scripts/test-m17-rewards.mjs

      - name: Test M18 Luck security
        if: github.ref_name == 'm18-luck'
        run: node scripts/test-m18-luck.mjs

      - name: Test M19 Coupons security
        if: github.ref_name == 'm19-coupons-clean'
        run: node scripts/test-m19-coupons.mjs

      - name: Test M20 Rank security
        if: github.ref_name == 'm20-rank-work'
        run: node scripts/test-m20-rank.mjs

      - name: Test M21 Status security
        if: github.ref_name == 'm21-status'
        run: node scripts/test-m21-status.mjs

      - name: Test M22 Academy security
        if: github.ref_name == 'm22-academy'
        run: node scripts/test-m22-academy.mjs

      - name: Test M23 Help
        if: github.ref_name == 'm23-help'
        run: node scripts/test-m23-help.mjs

      - name: Test M23.1 MT Sounds
        if: github.ref_name == 'm23-1-mtsounds-clean'
        run: node scripts/test-m23-1-mtsounds.mjs

      - name: Test M24 Control Center
        if: github.ref_name == 'm24-control-center-work'
        run: node scripts/test-m24-control-center.mjs

      - name: Test M25 Product Manager
        if: github.ref_name == 'm25-product-manager' || github.head_ref == 'm25-product-manager'
        run: node scripts/test-m25-product-manager.mjs

      - name: Test M26 Category Manager
        if: github.ref_name == 'm26-category-manager' || github.head_ref == 'm26-category-manager'
        run: node scripts/test-m26-category-manager.mjs

      - name: Test M27 Stock Manager
        if: github.ref_name == 'm27-stock-manager' || github.head_ref == 'm27-stock-manager'
        run: node scripts/test-m27-stock-manager.mjs

      - name: Test M28 Sales Manager
        if: github.ref_name == 'm28-sales-manager' || github.head_ref == 'm28-sales-manager'
        run: node scripts/test-m28-sales-manager.mjs

      - name: Test CRAZZY CALL transplant
        if: github.ref_name == 'm-discord-campaigns' || github.head_ref == 'm-discord-campaigns'
        run: node scripts/test-crazzy-call.mjs

      - name: Check unified Discord bot syntax
        if: github.ref_name == 'm-discord-campaigns' || github.head_ref == 'm-discord-campaigns'
        run: |
          node --check apps/discord-bot/src/index.js
          node --check apps/discord-bot/src/config.js
          node --check apps/discord-bot/src/supabase.js
          node --check apps/discord-bot/src/modules/campaigns.js
          node --check apps/discord-bot/src/modules/server-builder.js
          node --check apps/discord-bot/src/modules/commands.js

      - name: Test unified Discord integration
        if: github.ref_name == 'm-discord-campaigns' || github.head_ref == 'm-discord-campaigns'
        run: node scripts/test-discord-integration.mjs
