name: CRAZZY PROJECT Front CI

on:
  push:
    branches:
      - phase-1-home
      - m00-design-system
      - "m*-*"
  pull_request:
    branches:
      - main

concurrency:
  group: crazzy-front-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
