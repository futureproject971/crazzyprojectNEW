name: CRAZZY PROJECT Full Module CI\n\non:\n  push:\n    branches:\n      - main\n      - "m*-*"\n      - "production-*"\n  pull_request:\n    branches:\n      - main\n\nconcurrency:\n  group: crazzy-full-${{ github.ref }}\n  cancel-in-progress: true\n\njobs:\n  build:\n    runs-on: ubuntu-latest\n    timeout-minutes: 25\n    steps:\n      - name: Checkout\n        uses: actions/checkout@v4\n\n      - name: Setup Node\n        uses: actions/setup-node@v4\n        with:\n          node-version: 22\n\n      - name: Install\n        run: npm ci\n\n      - name: Typecheck\n        run: npm run typecheck\n\n      - name: Production build\n        run: npm run build\n\n      - name: Full module regression suite\n        run: node scripts/test-all-modules.mjs\n\n      - name: Unified Discord Bot Core syntax\n        run: npm --prefix apps/discord-bot run check\n